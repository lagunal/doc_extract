[project]
name = "doc-extract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lagunal", email = "ludwinglaguna@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docling>=2.131.0",
    "ipykernel>=7.3.0",
    "lancedb>=0.25.3",
    "numpy<2.0.0",
    "openai>=3.19.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "tiktoken>=0.14.0",
    "torch<=2.2.2",
    # Docling's current layout model uses RT-DETRv2, introduced in Transformers 4.55.
    # Keep the 4.x line for compatibility with the Intel-macOS PyTorch 2.2.2 wheel.
    "transformers>=4.55,<5",
]

[project.scripts]
doc-extract = "doc_extract:main"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
